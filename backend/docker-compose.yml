services:
  postgres:
    image: postgres:14
    container_name: stock-insight-postgres
    environment:
      POSTGRES_DB: stock_insight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
