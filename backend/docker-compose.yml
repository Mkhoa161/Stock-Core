services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: stock-insight-postgres
    environment:
      POSTGRES_DB: stock_insight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - stock-insight-network

  # Backend API
  backend:
    build: .
    container_name: stock-insight-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BASE_URL=http://localhost:3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=stock_insight
      - FRONTEND_URL=http://localhost:3001
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - stock-insight-network

volumes:
  postgres_data:

networks:
  stock-insight-network:
    driver: bridge
