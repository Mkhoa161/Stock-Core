# IMAGE_URI must be exported before running compose. See env.production.template for the ECR URI format.
# Usage: IMAGE_URI=<ecr-uri>:<tag> docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: ${IMAGE_URI}
    container_name: stock-insight-backend
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - stock-insight-network

networks:
  stock-insight-network:
    driver: bridge
